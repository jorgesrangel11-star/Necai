<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Necai - Control Operativo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9; padding: 12px; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { width: 100%; max-width: 480px; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { max-width: 180px; height: auto; object-fit: contain; }
        h2 { text-align: center; color: #1e3a8a; margin-top: 0; margin-bottom: 15px; font-size: 20px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; font-weight: 700; }
        label { font-weight: 600; display: block; margin-top: 14px; margin-bottom: 6px; color: #475569; font-size: 14px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background-color: #f8fafc; color: #334155; -webkit-appearance: none; appearance: none; }
        textarea { resize: vertical; min-height: 80px; }
        input:focus, textarea:focus { border-color: #2b6cb0; outline: none; background-color: #fff; box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15); }
        
        .dropdown-container { position: relative; width: 100%; }
        .dropdown-lista { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 220px; overflow-y: auto; z-index: 999; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-top: 4px; }
        .dropdown-item { padding: 12px 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; color: #334155; font-size: 15px; }
        .dropdown-item:active, .dropdown-item:hover { background-color: #e2e8f0; font-weight: bold; color: #1e3a8a; }

        .info-parque { display: none; background-color: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px 14px; border-radius: 8px; margin-top: 8px; font-size: 14px; font-weight: 600; }

        .btn-doble-container { display: flex; gap: 10px; margin-top: 8px; }
        .foto-section { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 16px 5px; border-radius: 10px; text-align: center; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; flex: 1; min-height: 60px; transition: background 0.2s; }
        .foto-section:hover { background: #e2e8f0; }
        .foto-section input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }
        .foto-label { color: #2b6cb0; font-weight: bold; font-size: 14px; z-index: 1; pointer-events: none; }
        .status-fotos { text-align: center; margin-top: 8px; font-weight: bold; color: #1e3a8a; font-size: 14px; }
        
        button[type="submit"] { width: 100%; background-color: #2f855a; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 25px; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        button[type="submit"]:disabled { background-color: #94a3b8; box-shadow: none; }
        .btn-limpiar { font-size: 12px; color: #ef4444; text-decoration: underline; cursor: pointer; position: relative; z-index: 10; margin-top: 4px; display: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="logo-container">
        <img src="https://i.postimg.cc/Gm70z8h0/Whats-App-Image-2026-06-01-at-1-51-39-PM-2.jpeg" alt="Logo Necai">
    </div>
    <h2>Evidencia de Mantenimiento</h2>
    
    <form id="reportForm">
        <label>Nombre del Supervisor:</label>
        <input type="text" id="supervisor_input" placeholder="Ej. Juan Pérez" required>

        <label>Busca y Selecciona el Parque:</label>
        <div class="dropdown-container">
            <input type="text" id="buscador_parques" placeholder="🔍 Escribe para buscar (Ej. Cristal)..." autocomplete="off" required>
            <div id="dropdown_lista" class="dropdown-lista">
                <div class="dropdown-item">Cargando parques...</div>
            </div>
            <input type="hidden" id="parque_seleccionado">
        </div>
        <div id="infoParque" class="info-parque"></div>

        <label>Descripción del Trabajo Realizado:</label>
        <textarea id="descripcion_input" placeholder="Ej. Se realizó poda de pasto, deshierbe y limpieza..." required></textarea>

        <input type="hidden" id="gps_coordenadas">

        <!-- ================= SECCIÓN ANTES ================= -->
        <label>Fotos ANTES del Mantenimiento:</label>
        <div class="btn-doble-container">
            <!-- Botón Cámara (SIN multiple) -->
            <div class="foto-section">
                <input type="file" accept="image/*" capture="environment" onchange="procesarFotosMultiples(this, 'fotoAntes', 'status_antes', 'btnLimpiarAntes')">
                <div class="foto-label">📸 Tomar Foto</div>
            </div>
            <!-- Botón Galería (CON multiple) -->
            <div class="foto-section">
                <input type="file" accept="image/*" multiple onchange="procesarFotosMultiples(this, 'fotoAntes', 'status_antes', 'btnLimpiarAntes')">
                <div class="foto-label">🖼️ Galería</div>
            </div>
        </div>
        <div id="status_antes" class="status-fotos">0/10 Fotos agregadas</div>
        <div style="text-align:center;"><span class="btn-limpiar" id="btnLimpiarAntes" onclick="limpiarFotos('fotoAntes', 'status_antes', 'btnLimpiarAntes')">Borrar fotos de esta sección</span></div>

        <!-- ================= SECCIÓN DURANTE ================= -->
        <label>Fotos DURANTE el Proceso:</label>
        <div class="btn-doble-container">
            <!-- Botón Cámara (SIN multiple) -->
            <div class="foto-section">
                <input type="file" accept="image/*" capture="environment" onchange="procesarFotosMultiples(this, 'fotoDurante', 'status_durante', 'btnLimpiarDurante')">
                <div class="foto-label">📸 Tomar Foto</div>
            </div>
            <!-- Botón Galería (CON multiple) -->
            <div class="foto-section">
                <input type="file" accept="image/*" multiple onchange="procesarFotosMultiples(this, 'fotoDurante', 'status_durante', 'btnLimpiarDurante')">
                <div class="foto-label">🖼️ Galería</div>
            </div>
        </div>
        <div id="status_durante" class="status-fotos">0/10 Fotos agregadas</div>
        <div style="text-align:center;"><span class="btn-limpiar" id="btnLimpiarDurante" onclick="limpiarFotos('fotoDurante', 'status_durante', 'btnLimpiarDurante')">Borrar fotos de esta sección</span></div>

        <!-- ================= SECCIÓN DESPUÉS ================= -->
        <label>Fotos DESPUÉS del Mantenimiento:</label>
        <div class="btn-doble-container">
            <!-- Botón Cámara (SIN multiple) -->
            <div class="foto-section">
                <input type="file" accept="image/*" capture="environment" onchange="procesarFotosMultiples(this, 'fotoDespues', 'status_despues', 'btnLimpiarDespues')">
                <div class="foto-label">📸 Tomar Foto</div>
            </div>
            <!-- Botón Galería (CON multiple) -->
            <div class="foto-section">
                <input type="file" accept="image/*" multiple onchange="procesarFotosMultiples(this, 'fotoDespues', 'status_despues', 'btnLimpiarDespues')">
                <div class="foto-label">🖼️ Galería</div>
            </div>
        </div>
        <div id="status_despues" class="status-fotos">0/10 Fotos agregadas</div>
        <div style="text-align:center;"><span class="btn-limpiar" id="btnLimpiarDespues" onclick="limpiarFotos('fotoDespues', 'status_despues', 'btnLimpiarDespues')">Borrar fotos de esta sección</span></div>

        <button type="submit" id="btnSubmit">Enviar Reporte Múltiple</button>
    </form>
</div>

<script>
    let todosLosParques = [];
    let m2Seleccionado = "No registrado"; 
    
    const memoriaFotos = {
        fotoAntes: [],
        fotoDurante: [],
        fotoDespues: []
    };

    const inputBuscador = document.getElementById('buscador_parques');
    const listaDropdown = document.getElementById('dropdown_lista');
    const inputOculto = document.getElementById('parque_seleccionado');
    const divInfoParque = document.getElementById('infoParque');

    document.addEventListener("DOMContentLoaded", () => {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => document.getElementById('gps_coordenadas').value = `${pos.coords.latitude}, ${pos.coords.longitude}`,
                (err) => console.warn("GPS denegado")
            );
        }

        google.script.run.withSuccessHandler(function(listaParques) {
            todosLosParques = listaParques;
            inputBuscador.placeholder = "🔍 Escribe para buscar (Ej. Cristal)...";
            renderizarLista(todosLosParques);
        }).obtenerListaParques();
    });

    function renderizarLista(lista) {
        listaDropdown.innerHTML = '';
        if (lista.length === 0) {
            listaDropdown.innerHTML = '<div class="dropdown-item" style="color:red;">No se encontró ningún parque</div>';
            return;
        }
        lista.forEach(parque => {
            let div = document.createElement('div');
            div.className = 'dropdown-item';
            div.textContent = parque.id + " - " + parque.nombre;
            div.onclick = function() {
                inputBuscador.value = div.textContent; 
                inputOculto.value = parque.id;         
                m2Seleccionado = parque.m2; 
                listaDropdown.style.display = 'none';  

                divInfoParque.innerHTML = `📐 Superficie del parque: <b>${parque.m2} m²</b>`;
                divInfoParque.style.display = 'block';
            };
            listaDropdown.appendChild(div);
        });
    }

    inputBuscador.addEventListener('input', function(e) {
        listaDropdown.style.display = 'block';
        let textoBuscado = e.target.value.toLowerCase();
        let parquesFiltrados = todosLosParques.filter(parque => 
            parque.nombre.toLowerCase().includes(textoBuscado) || 
            parque.id.toString().includes(textoBuscado)
        );
        renderizarLista(parquesFiltrados);
        inputOculto.value = ""; 
        m2Seleccionado = "No registrado";
        divInfoParque.style.display = 'none'; 
    });

    inputBuscador.addEventListener('focus', function() {
        listaDropdown.style.display = 'block';
        if (inputBuscador.value === "") {
            renderizarLista(todosLosParques);
        }
    });

    document.addEventListener('click', function(e) {
        if(!e.target.closest('.dropdown-container')) {
            listaDropdown.style.display = 'none';
        }
    });

    function procesarFotosMultiples(input, categoria, statusId, btnLimpiarId) {
        if (!input.files || input.files.length === 0) return;
        let archivosNuevos = Array.from(input.files);
        let limite = 10;
        
        if (memoriaFotos[categoria].length + archivosNuevos.length > limite) {
            alert(`Solo puedes subir un máximo de ${limite} fotos por sección.`);
            input.value = ""; 
            return;
        }

        document.getElementById(statusId).innerText = "⏳ Procesando imágenes...";
        let procesadas = 0;
        
        archivosNuevos.forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let ancho = img.width, alto = img.height, maxAncho = 1280;
                    if (ancho > maxAncho) { alto = Math.round((alto * maxAncho) / ancho); ancho = maxAncho; }
                    canvas.width = ancho; canvas.height = alto;
                    ctx.drawImage(img, 0, 0, ancho, alto);
                    
                    memoriaFotos[categoria].push(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
                    procesadas++;
                    
                    if(procesadas === archivosNuevos.length) {
                        let total = memoriaFotos[categoria].length;
                        document.getElementById(statusId).innerText = `✅ ${total}/10 Fotos agregadas`;
                        document.getElementById(btnLimpiarId).style.display = "inline-block";
                        input.value = ""; 
                    }
                };
            };
            reader.readAsDataURL(file);
        });
    }

    function limpiarFotos(categoria, statusId, btnLimpiarId) {
        memoriaFotos[categoria] = [];
        document.getElementById(statusId).innerText = "0/10 Fotos agregadas";
        document.getElementById(btnLimpiarId).style.display = "none";
    }

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let idExtraido = inputOculto.value;

        if(!idExtraido) {
            alert("Por favor selecciona un parque válido de la lista desplegable.");
            return;
        }

        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "⏳ Subiendo reporte y fotos...";

        const payload = {
            fecha: new Date().toISOString().split('T')[0], 
            supervisor: document.getElementById('supervisor_input').value,
            inventario: idExtraido,
            m2_parque: m2Seleccionado, 
            gps_coordenadas: document.getElementById('gps_coordenadas').value,
            descripcion: document.getElementById('descripcion_input').value,
            fotoAntes: memoriaFotos['fotoAntes'],
            fotoDurante: memoriaFotos['fotoDurante'],
            fotoDespues: memoriaFotos['fotoDespues']
        };

        google.script.run
            .withSuccessHandler(function(response) {
                if(response.result === "success") {
                    btn.innerText = "✅ Reporte Enviado con Éxito";
                    btn.style.backgroundColor = "#16a34a";
                    setTimeout(() => { 
                        document.getElementById('reportForm').reset(); 
                        inputOculto.value = "";
                        m2Seleccionado = "No registrado";
                        divInfoParque.style.display = 'none'; 
                        
                        limpiarFotos('fotoAntes', 'status_antes', 'btnLimpiarAntes');
                        limpiarFotos('fotoDurante', 'status_durante', 'btnLimpiarDurante');
                        limpiarFotos('fotoDespues', 'status_despues', 'btnLimpiarDespues');
                        
                        btn.disabled = false; 
                        btn.innerText = "Enviar Reporte Múltiple"; 
                        btn.style.backgroundColor = "#2f855a"; 
                    }, 3000);
                } else {
                    alert("Error al subir: " + response.error);
                    btn.disabled = false; btn.innerText = "Reintentar";
                }
            })
            .withFailureHandler(function(error) {
                alert("Hubo un fallo de conexión. Intenta en una zona con mejor señal.");
                btn.disabled = false; btn.innerText = "Reintentar";
            })
            .procesarDesdeFront(JSON.stringify(payload));
    });
</script>

</body>

    // Carga automática de los parques en el selector         
    const selectElement = document.getElementById('parque_select');
    baseParques.forEach(parque => {
        const option = document.createElement('option');
        option.value = parque.name;
        option.textContent = `${parque.name} (${parque.deleg})`;
        option.setAttribute('data-inv', parque.inv);
        option.setAttribute('data-deleg', parque.deleg);
        option.setAttribute('data-gps', parque.gps);
        selectElement.appendChild(option);
    });

    function actualizarDatosParque() {
        var select = document.getElementById("parque_select");
        var selectedOption = select.options[select.selectedIndex];
        
        if(selectedOption.value !== "") {
            document.getElementById("no_inventario").value = selectedOption.getAttribute("data-inv");
            document.getElementById("delegacion").value = selectedOption.getAttribute("data-deleg");
            document.getElementById("gps_coordenadas").value = selectedOption.getAttribute("data-gps");
        }
    }

  

    // === CÓDIGO MAESTRO PARA ENVIAR DATOS Y FOTOS GRATIS ===
    const blobsBase64 = { fotoAntes: "", fotoDurante: "", fotoDespues: "" };

    // Capturar y procesar las imágenes de tus campos reales
    document.getElementById('fotoAntes').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) { blobsBase64.fotoAntes = evt.target.result.split(',')[1]; };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('fotoDurante').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) { blobsBase64.fotoDurante = evt.target.result.split(',')[1]; };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('fotoDespues').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) { blobsBase64.fotoDespues = evt.target.result.split(',')[1]; };
            reader.readAsDataURL(file);
        }
    });

    // Envío silencioso por AJAX
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        alert("🚀 Subiendo reporte oficial... Procesando fotos en alta velocidad de forma gratuita. No cierres la página.");

        const payload = {
            fecha: document.getElementById('fecha_automatica').value,
            inventario: document.getElementById('no_inventario').value,
            parque: document.getElementById('parque_select').value,
            delegacion: document.getElementById('delegacion').value,
            gps: document.getElementById('gps_coordenadas').value,
            supervisor: document.getElementById('supervisor_input').value,
            fotoAntes: blobsBase64.fotoAntes,
            fotoDurante: blobsBase64.fotoDurante,
            fotoDespues: blobsBase64.fotoDespues
        };

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert("✅ ¡Reporte enviado con éxito! Los datos y las fotos ya quedaron registrados en tu Google Sheets.");
            document.getElementById('reportForm').reset();
        } catch (error) {
            alert("❌ Falló el envío: " + error.message);
        }
    });
</script>
